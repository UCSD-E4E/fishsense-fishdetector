[project]
name = "fishsense-fishdetector"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fishsense-core",
    "ipykernel>=7.2.0",
    "ipywidgets>=8.1.8",
    "opencv-python>=4.13.0.92",
    "pandas>=3.0.1",
    "pyyaml>=6.0.3",
    "scikit-image>=0.26.0",
    "shapely>=2.1.2",
    "timm>=1.0.26",
    "tqdm>=4.67.3",
    "ultralytics>=8.4.19",
    "sam3",  # via tool.uv.sources (git+no-deps)
    "einops>=0.8",
    "hydra-core>=1.3",
    "iopath>=0.1.10",
    "ftfy>=6",
    "pycocotools>=2.0.11",
    "regex>=2024.0.0",
    "tabulate>=0.9",
    "setuptools<80",  # sam3 imports pkg_resources, removed in setuptools >= 80
]

[tool.uv.sources]
# Pinned to v2.1.3: CUDA execution provider behind the `cuda` Cargo feature
# (v2.1.0), nvidia-CUDA-lib preload + active-EP accessor (v2.1.1), the
# openblas-src `rustls` workaround so the build doesn't trip openblas-build
# 0.10.16's compile_error (v2.1.1), ORT intra-op thread cap (v2.1.2), and a
# CUDA wheel built against onnxruntime-gpu so it loads on glibc < 2.38
# (v2.1.2 / v2.1.3). Build with CUDA enabled via
# `MATURIN_PEP517_ARGS="--features cuda"` or
# `--config-setting 'build-args=--features cuda'`; without it, CPU-only.
fishsense-core = { git = "https://github.com/UCSD-E4E/fishsense-core", subdirectory = "python/fishsense_core", tag = "fishsense_core-v2.1.3" }
sam3 = { git = "https://github.com/facebookresearch/sam3" }

[tool.uv]
# sam3 pins numpy<2 in its setup.py but works fine on numpy 2.x at runtime
# (the pin is stale). fishsense-core needs numpy>=2.3.5. Override to allow
# both packages in the same env.
override-dependencies = ["numpy>=2.3.5"]
